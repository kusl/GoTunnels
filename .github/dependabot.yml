# Dependabot covers the surfaces where reachability analysis does not apply:
# container base images (Containerfiles and compose.yaml) and the GitHub
# Actions versions themselves. The Go module graph is handled by govulncheck
# and the weekly dependency-freshness workflow instead.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
